<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="styles.css">
	<link rel="icon" href="images/icon.ico">

	<title>cancel</title>
</head>

<body>

	<div class="proofGraphic" style="text-align:center; margin:5px">
			<input type="text" id="i" oninput="f()">
			<p id="o"></p>
			<canvas id="c" width="800" height="400"></canvas>
	</div>

	<div class="backButton"><a href="index.html">back</a></div>

	<script>
	const cv = document.getElementById("c");
	const c = cv.getContext("2d");
	c.translate(400,200);

	l=(s)=>{
		y=s.map(v).map(z=>z===undefined ? 0:z);
		k=y.length;x=[...Array(k).keys()].map(i=>++i)
		xs=0,ys=0,xx=0,xy=0
		for (i=0;i<k;i++) {xs+=x[i];ys+=y[i];xx+=x[i]*x[i];xy+=x[i]*y[i]}
		m=(k*xy-xs*ys)/(k*xx-xs*xs);return([m,(ys/k)-(m*xs)/k])
	}

	a=(l)=>{
		r=({"a":"z","b":"y","c":"x","d":"w","e":"v","f":"u","g":"t","h":"s","i":"r","j":"q","k":"p","l":"o","m":"n",
		"n":"m","o":"l","p":"k","q":"j","r":"i","s":"h","t":"g","u":"f","v":"e","w":"d","x":"c","y":"b","z":"a"})[l];
		if (r===undefined) {return l} else {return r}
	}

	v=(l)=>({"a":1,"b":2,"c":3,"d":4,"e":5,"f":6,"g":7,"h":8,"i":9,"j":10,"k":11,"l":2,"m":13,
	"n":14,"o":15,"p":16,"q":17,"r":18,"s":19,"t":20,"u":21,"v":22,"w":23,"x":24,"y":25,"z":26})[l]

	f=()=>{
		s=document.getElementById("i").value.toLowerCase().split("")
		n=s.map(a);
		r=l(s);rn=l(n);
		c.beginPath();o=500;
		c.fillStyle="#fff";
		c.fillRect(-o,-o,999,999);
		c.moveTo(-o,-o*r[0]+r[1]);3
		c.lineTo(o,o*r[0]+r[1]);
		c.moveTo(-o,-o*rn[0]+rn[1]);
		c.lineTo(o,o*rn[0]+rn[1]);
		c.stroke();
		document.getElementById("o").innerText=(s.join("")+" | "+n.join(""))
	}
	</script>

</body>

</html>
